<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Community pavilion — concept area diagram</title>
  <desc id="desc">A 24 by 18 metre pavilion plan with a hall, circulation spine, lobby, cafe, support and sanitary rooms, alongside an illustrative east elevation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a15b36"/></marker>
    <marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M6 1 L1 6" stroke="#58635f" stroke-width="1.4"/></marker>
    <style>
      text{font-family:DejaVu Sans,Arial,sans-serif;fill:#26312e} .eyebrow{font-size:15px;font-weight:700;letter-spacing:2.2px;fill:#a15b36} .title{font-size:38px;font-weight:700;letter-spacing:-.7px} .sub{font-size:18px;fill:#58635f} .section{font-size:17px;font-weight:700;letter-spacing:1.2px} .room{font-size:21px;font-weight:700} .area{font-size:18px;fill:#52605a} .small{font-size:15px;fill:#58635f} .tiny{font-size:13px;fill:#58635f} .dimtext{font-size:17px;font-weight:700;fill:#45524c} .wall{stroke:#34413c;stroke-width:3} .thin{stroke:#87918b;stroke-width:1.3;fill:none} .route{stroke:#a15b36;stroke-width:4;stroke-dasharray:9 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f8f7f2"/>
  <text x="80" y="62" class="eyebrow">ARCHITECTURE / WORKED EXAMPLE</text>
  <text x="80" y="112" class="title">Community pavilion</text>
  <text x="80" y="145" class="sub">A simple framework for exhibition, gathering and shared activity</text>
  <text x="1360" y="67" text-anchor="end" class="eyebrow">SCHEMATIC CONCEPT</text>
  <line x1="80" y1="176" x2="1360" y2="176" stroke="#d4d9d3"/>

  <text x="120" y="210" class="section">01 / AREA PLAN</text>
  <text x="840" y="210" text-anchor="end" class="small">Illustrative north ↑</text>
  <!-- 30 pixels per metre; external footprint 24 x 18 m -->
  <rect x="120" y="260" width="360" height="540" fill="#e5e6da"/>
  <rect x="480" y="260" width="120" height="540" fill="#d6ddd6"/>
  <rect x="600" y="260" width="240" height="180" fill="#ead7c4"/>
  <rect x="600" y="440" width="240" height="180" fill="#ede3d5"/>
  <rect x="600" y="620" width="240" height="90" fill="#dbe1dc"/>
  <rect x="600" y="710" width="240" height="90" fill="#cfd9d5"/>
  <rect x="120" y="260" width="720" height="540" fill="none" class="wall"/>
  <path d="M480 260V460 M480 500V800 M600 260V335 M600 375V515 M600 555V650 M600 680V745 M600 775V800 M600 440H840 M600 620H840 M600 710H840" fill="none" class="wall"/>
  <!-- Conceptual openings at each room; no door swing implied -->
  <path d="M840 322V378" stroke="#f8f7f2" stroke-width="7"/>
  <path d="M889 350H740H540V480H455" class="route"/>
  <text x="300" y="510" text-anchor="middle" class="room">Exhibition hall</text>
  <text x="300" y="540" text-anchor="middle" class="area">216 m²</text>
  <text x="540" y="584" text-anchor="middle" class="room" style="font-size:16px">Gallery /</text>
  <text x="540" y="607" text-anchor="middle" class="room" style="font-size:16px">circulation</text>
  <text x="540" y="633" text-anchor="middle" class="area">72 m²</text>
  <text x="720" y="307" text-anchor="middle" class="room">East lobby</text>
  <text x="720" y="332" text-anchor="middle" class="area">48 m²</text>
  <text x="720" y="510" text-anchor="middle" class="room">Café / social</text>
  <text x="720" y="538" text-anchor="middle" class="area">48 m²</text>
  <text x="720" y="657" text-anchor="middle" class="room">Support</text>
  <text x="720" y="683" text-anchor="middle" class="area">24 m²</text>
  <text x="720" y="747" text-anchor="middle" class="room">Sanitary</text>
  <text x="720" y="773" text-anchor="middle" class="area">24 m²</text>
  <text x="889" y="331" text-anchor="end" class="tiny">ENTRY</text>
  <!-- Overall dimensions -->
  <path d="M120 245V225 M840 245V225 M120 233H840" class="thin" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="452" y="220" width="56" height="24" fill="#f8f7f2"/><text x="480" y="238" text-anchor="middle" class="dimtext">24 m</text>
  <path d="M105 260H80 M105 800H80 M90 260V800" class="thin" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <rect x="70" y="510" width="40" height="40" fill="#f8f7f2"/><text x="90" y="535" text-anchor="middle" class="dimtext" transform="rotate(-90 90 535)">18 m</text>

  <text x="950" y="210" class="section">02 / EAST ELEVATION</text>
  <text x="950" y="238" class="small">Illustrative composition, not a design specification</text>
  <rect x="950" y="279" width="410" height="257" rx="2" fill="#eef0e9"/>
  <path d="M975 489H1335" stroke="#89958b" stroke-width="2"/>
  <path d="M995 366H1318V484H995Z" fill="#e4e1d5" stroke="#34413c" stroke-width="2"/>
  <path d="M985 364H1328L1313 349H1000Z" fill="#34413c"/>
  <path d="M1016 389H1088V484H1016Z M1125 389H1197V484H1125Z M1234 389H1300V484H1234Z" fill="#bacbc5" stroke="#576961" stroke-width="2"/>
  <path d="M1052 389V484 M1161 389V484 M1267 389V484" stroke="#576961" stroke-width="2"/>
  <path d="M1096 374V484 M1105 374V484 M1210 374V484 M1219 374V484" stroke="#ae7957" stroke-width="5"/>
  <text x="975" y="516" class="tiny">Glazing and timber accents are illustrative only.</text>
  <text x="950" y="596" class="section">READING THE PLAN</text>
  <line x1="950" y1="616" x2="1360" y2="616" stroke="#d4d9d3"/>
  <rect x="950" y="640" width="18" height="18" fill="#e5e6da" stroke="#a6afa6"/><text x="980" y="655" class="small">Primary gathering space</text>
  <rect x="950" y="681" width="18" height="18" fill="#d6ddd6" stroke="#a6afa6"/><text x="980" y="696" class="small">Shared circulation / gallery</text>
  <rect x="950" y="722" width="18" height="18" fill="#ead7c4" stroke="#a6afa6"/><text x="980" y="737" class="small">Lobby and supporting rooms</text>
  <path d="M950 781H1002" class="route"/><text x="1018" y="786" class="small">Conceptual arrival route</text>
  <line x1="80" y1="850" x2="1360" y2="850" stroke="#cdd3cb"/>
  <text x="80" y="888" class="section">432 m²</text><text x="80" y="913" class="small">GEOMETRIC FOOTPRINT</text>
  <text x="340" y="888" class="small">Concept area diagram / no wall allowance / not for construction</text>
  <text x="340" y="915" class="small">Orientation assumed. Structure, code, fire and accessibility remain unverified.</text>
  <text x="1360" y="957" text-anchor="end" class="tiny">SYNTHETIC BRIEF · 01</text>
</svg>
